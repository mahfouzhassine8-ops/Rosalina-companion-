plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hassine.bubbles'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hassine.bubbles'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
