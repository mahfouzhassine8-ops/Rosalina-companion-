plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.fold.windowsjit.probe'
    compileSdk = 36
    ndkVersion = '27.2.12479018'

    defaultConfig {
        applicationId = 'com.fold.windowsjit.probe'
        minSdk = 30
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0-poc'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cFlags '-std=c11 -O2'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            // Public upstream QubeVM test signing key, copied by CI.
            // Non-production and limited to this separate app identity.
            storeFile = file('../test-signing/testkey.keystore')
            storePassword = 'android'
            keyAlias = 'androidtestkey'
            keyPassword = 'android'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}
