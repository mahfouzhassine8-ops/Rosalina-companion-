name: Motion Lab photo selection and UI recreation tests
on:
  push:
    branches: [motion-ui-validation]
permissions:
  contents: read
jobs:
  screen-and-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test photo import, prompt preservation and MP4 encoding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            gradle :motion:connectedDebugAndroidTest --max-workers=2 --stacktrace
            mkdir -p motion-ui-output
            adb exec-out run-as com.rosalina.motionlab cat files/qa/motion-photo-screen.png > motion-ui-output/motion-photo-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Motion-Lab-screen-and-codec-validation
          path: |
            motion-ui-output/
            motion/build/outputs/androidTest-results/
