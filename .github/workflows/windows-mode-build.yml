name: Windows Mode - Win11 Setup Tools, Fullscreen, Efficient Display APK
on:
  push:
    branches: [windows-mode-android-research]
    paths: ['.github/workflows/windows-mode-build.yml']
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out scoped Windows Mode repair script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Retrieve GPL source at release tag
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 7.1.4 https://github.com/rhn-1k/QubeVM.git upstream
          cd upstream
          git rev-parse HEAD | tee /tmp/qube-source-commit.txt
      - name: Rehydrate complete Android ARM64 QEMU runtime from pinned upstream release
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/rhn-1k/QubeVM/releases/download/7.1.4/qube-arm-q11.1.3-android-arm64-v8a-release.apk' -o /tmp/upstream-qube.apk
          mkdir -p /tmp/qube-extracted
          unzip -oq /tmp/upstream-qube.apk 'lib/arm64-v8a/*' -d /tmp/qube-extracted
          mkdir -p upstream/qube-android-arm/src/main/jniLibs/arm64-v8a upstream/qube-android-lib/src/main/jniLibs/arm64-v8a
          cp /tmp/qube-extracted/lib/arm64-v8a/libqemu-system-aarch64.so upstream/qube-android-arm/src/main/jniLibs/arm64-v8a/
          for so in /tmp/qube-extracted/lib/arm64-v8a/*.so; do
            if [ "$(basename "$so")" != libqemu-system-aarch64.so ]; then
              cp "$so" upstream/qube-android-lib/src/main/jniLibs/arm64-v8a/
            fi
          done
          test -s upstream/qube-android-arm/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so
          test -s upstream/qube-android-lib/src/main/jniLibs/arm64-v8a/libqube.so
      - name: Restore QEMU 11.1.3 ROMs and keyboard maps from matching upstream source
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --branch v11.1.3 https://github.com/qemu/qemu.git /tmp/qemu-rom-source
          git -C /tmp/qemu-rom-source sparse-checkout set pc-bios
          ROMS="upstream/qube-android-lib/src/main/assets/roms"
          mkdir -p "$ROMS/keymaps"
          find /tmp/qemu-rom-source/pc-bios -maxdepth 1 -type f \( -name '*.rom' -o -name '*.bin' -o -name '*.img' -o -name '*.rsrc' \) -exec cp -f {} "$ROMS/" \;
          cp -af /tmp/qemu-rom-source/pc-bios/keymaps/. "$ROMS/keymaps/"
          echo 11.1.3 > upstream/qube-android-lib/src/main/assets/QEMU_VERSION
          test -s "$ROMS/efi-e1000.rom"
          test -s "$ROMS/efi-virtio.rom"
          test -s "$ROMS/keymaps/en-us"
          test -s "$ROMS/QUBE_ARM_EFI.fd"
          test -s "$ROMS/QUBE_ARM_VARS.fd"
          test -s upstream/qube-android-lib/src/main/assets/QEMU_VERSION
          echo "QEMU BIOS files: $(find "$ROMS" -maxdepth 1 -type f | wc -l)"
          echo "QEMU keyboard layouts: $(find "$ROMS/keymaps" -maxdepth 1 -type f | wc -l)"
          echo "QEMU BIOS source: https://github.com/qemu/qemu/tree/v11.1.3/pc-bios"
          sha256sum "$ROMS/efi-e1000.rom" "$ROMS/keymaps/en-us"
      - name: Isolate package ID and clearly label derivative as research build
        run: |
          set -euo pipefail
          cd upstream
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qube-android-arm/build.gradle')
          s=p.read_text()
          assert 'applicationId = "com.qubevm.arm"' in s
          p.write_text(s.replace('applicationId = "com.qubevm.arm"', 'applicationId = "com.fold.windowsmode.research"'))
          manifest=Path('qube-android-arm/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          assert 'android:versionCode="70104"' in m, 'Do not change an unknown baseline versionCode'
          m=m.replace('android:versionCode="70104"', 'android:versionCode="70112"')
          m=m.replace('android:versionName="7.1.4-arm"', 'android:versionName="7.1.12-setupdisplay"')
          manifest.write_text(m)
          p=Path('qube-android-arm/src/main/res/values/strings.xml')
          s=p.read_text().replace('>QubeVM ARM<','>Windows Mode (QubeVM-based test)<').replace('>Qube ARM<','>Windows Mode Test<')
          p.write_text(s)
          for f in Path('.').rglob('build.gradle'):
              old=f.read_text()
              new=old.replace('compileSdk = 37', 'compileSdk = 36').replace('targetSdk = 37', 'targetSdk = 35')
              if new!=old: f.write_text(new)
          PY
          {
             echo 'Windows Mode Android — engine-integrated experimental build'
             echo 'NOT YET TESTED BOOTING WINDOWS 11 ARM64 ON GALAXY FOLD.'
             echo 'This is a derivative of QubeVM GPL-3.0, not an independently implemented QEMU VM manager.'
             echo 'Original upstream: https://github.com/rhn-1k/QubeVM'
             printf 'Upstream source commit: '
             cat /tmp/qube-source-commit.txt
             echo 'Includes QEMU and its GPL-licensed dependencies from upstream v7.1.4 release, and QEMU firmware/keymaps from v11.1.3.'
             echo 'Source is available at the upstream repository and source commit above.'
             echo 'Test signing uses the public upstream Android test key, NOT production identity.'
             echo '7.1.12-setupdisplay preserves all signed 7.1.11 features and adds Windows-only Fit/Fill/Stretch display, recoverable immersive full-screen, optional 30fps render efficiency, confirmed OOBE Setup Tools and read-only NAT adapter check. Does NOT alter disk image, installed Windows, UEFI, CPU, stored VM network configuration, or other virtual machines.'
             echo 'Native QEMU ARM64 remains unchanged. New display modes transform Android framebuffer only; they do not change Windows guest resolution. Efficient render reduces redraw polling and QEMU display pump frequency but cannot enable KVM or guarantee faster Windows CPU execution. Network Check reads QMP; it cannot verify a Windows ARM64 NIC driver. Physical Fold acceptance still required.'
             echo 'User confirmed 7.1.11 feels quicker but Windows OOBE Just a moment can still take 10+ minutes. Setup Tools are explicit user-triggered, command acceptance unknown (newer Windows builds disable some methods). Android IME/fold and Fast CPU behavior retained. Device tests pending.'
             echo 'No Windows media is included. Same Android ID and public test-key certificate, higher versionCode; existing QCOW2, VM and settings not altered by this workflow.'
          } > /tmp/WINDOWS_MODE_BUILD_NOTICE.txt
      - name: Preserve 70111; add Windows-only fullscreen and opt-in OOBE tools
        run: |
          set -euo pipefail
          test -s windows-mode-source-repairs.py
          python3 -m py_compile windows-mode-source-repairs.py windows-mode-ui-repairs.py windows-mode-performance-repairs.py windows-mode-setup-display-repairs.py
          python3 windows-mode-source-repairs.py upstream
          python3 windows-mode-ui-repairs.py upstream
          python3 windows-mode-performance-repairs.py upstream
          python3 windows-mode-setup-display-repairs.py upstream
      - name: Confirm Android environment and provision missing SDKs
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed experimental ARM64 APK
        run: |
          set -euo pipefail
          cd upstream
          gradle --no-daemon --stacktrace :qube-android-arm:assembleRelease -PqemuVersion=11.1.3
          find qube-android-arm/build/outputs/apk -type f -name '*.apk' -ls
          APK=$(find qube-android-arm/build/outputs/apk -type f -name '*.apk' | head -n1)
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              required = ('assets/roms/efi-e1000.rom', 'assets/roms/efi-virtio.rom',
                          'assets/roms/keymaps/en-us', 'assets/QEMU_VERSION',
                          'lib/arm64-v8a/libqemu-system-aarch64.so')
              for name in required:
                  assert name in z.namelist(), f"Missing critical QEMU resource: {name}"
                  assert z.getinfo(name).file_size > 0, f"Zero-sized QEMU resource: {name}"
                  print("VERIFIED", name, z.getinfo(name).file_size)
          PY
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/windows-mode-signature.txt
          grep -q 'a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc' /tmp/windows-mode-signature.txt
          "$SDK_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:)" | tee /tmp/windows-mode-badging.txt
          grep -q "name='com.fold.windowsmode.research' versionCode='70112'" /tmp/windows-mode-badging.txt
          mkdir -p /tmp/windowsmode-out
          cp "$APK" /tmp/windowsmode-out/WindowsMode-QEMU-SETUPDISPLAY-70112.apk
          cp COPYING /tmp/windowsmode-out/QubeVM-GPL-3.0-LICENSE.txt
          cp /tmp/WINDOWS_MODE_BUILD_NOTICE.txt /tmp/windowsmode-out/BUILD_NOTICE.txt
          cp /tmp/windows-mode-signature.txt /tmp/windowsmode-out/SIGNATURE_VERIFY.txt
          cp /tmp/windows-mode-badging.txt /tmp/windowsmode-out/PACKAGE_VERIFY.txt
          sha256sum /tmp/windowsmode-out/WindowsMode-QEMU-SETUPDISPLAY-70112.apk > /tmp/windowsmode-out/APK-SHA256.txt
      - name: Upload Windows Mode research APK and licensing
        uses: actions/upload-artifact@v4
        with:
          name: windows-mode-arm64-setupdisplay-70112-apk
          path: /tmp/windowsmode-out/
          if-no-files-found: error
