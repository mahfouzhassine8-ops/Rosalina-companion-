name: Rosalina Motion Lab V3
on:
  push:
    branches: [motion-lab-v3-permanent-signing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-lab-v3-permanent-signing
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both locked applications remain unchanged
        run: git diff --exit-code 37bb610977054fe20626acbdc3ba14483354d578 HEAD -- app lib studio image-engine
      - uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
          path: third_party/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create permanent Motion Lab signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          STOREPASS="$(openssl rand -hex 24)"
          KEYPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          keytool -genkeypair -v             -keystore "$PWD/signing/rosalina-motion.jks"             -storepass "$STOREPASS"             -alias rosalina-motion             -keypass "$KEYPASS"             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=Rosalina Motion Lab, OU=Rosalina, O=Rosalina, L=Local, ST=Local, C=US"
          printf '%s' "$STOREPASS" > signing/storepass.txt
          printf '%s' "$KEYPASS" > signing/keypass.txt
          echo "MOTION_STOREPASS=$STOREPASS" >> "$GITHUB_ENV"
          echo "MOTION_KEYPASS=$KEYPASS" >> "$GITHUB_ENV"
      - name: Build isolated ARM64 video worker
        run: |
          cmake -S motion-engine -B native-motion -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_SOURCE="$PWD/third_party/stable-diffusion.cpp" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.13113456/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static
          cmake --build native-motion --target rosalina-motion --parallel 2
          mkdir -p motion/src/main/jniLibs/arm64-v8a
          cp native-motion/rosalina-motion motion/src/main/jniLibs/arm64-v8a/librosalina-motion.so
          "$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" motion/src/main/jniLibs/arm64-v8a/librosalina-motion.so
          chmod 755 motion/src/main/jniLibs/arm64-v8a/librosalina-motion.so
      - name: Bundle pinned lightweight decoder and license notices
        run: |
          mkdir -p motion/src/main/assets/licenses
          curl -fL --retry 4 "https://raw.githubusercontent.com/madebyollin/taehv/011dfc2112197741c540e0bdd5b7b67bcc930771/safetensors/taew2_2.safetensors" -o motion/src/main/assets/taew2_2.safetensors
          echo 'b84609b2a133d48434bd9636bfcb44bf05168dc436e2d3cecf26256faa1f5325  motion/src/main/assets/taew2_2.safetensors' | sha256sum -c -
          sha256sum motion/src/main/assets/taew2_2.safetensors | cut -d' ' -f1 > motion/src/main/assets/tae.sha256
          curl -fL --retry 4 "https://raw.githubusercontent.com/madebyollin/taehv/011dfc2112197741c540e0bdd5b7b67bcc930771/LICENSE" -o motion/src/main/assets/licenses/TAEHV.txt
          python3 - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('third_party/stable-diffusion.cpp')
          for p in root.rglob('*'):
              if p.is_file() and p.name.lower() in ['license','license.md','license.txt','copying']:
                  shutil.copyfile(p,pathlib.Path('motion/src/main/assets/licenses')/str(p.relative_to(root)).replace('/','_'))
          PY
      - name: Build APK and run unit tests
        run: |
          gradle :motion:testDebugUnitTest :motion:assembleDebug --max-workers=2 --stacktrace             -PmotionSigningStore="$PWD/signing/rosalina-motion.jks"             -PmotionSigningStorePassword="$MOTION_STOREPASS"             -PmotionSigningKeyAlias=rosalina-motion             -PmotionSigningKeyPassword="$MOTION_KEYPASS"
      - name: Validate package and preserve source
        run: |
          mkdir -p delivery
          APK=motion/build/outputs/apk/debug/motion-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > delivery/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > delivery/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > delivery/permissions.txt
          if grep -q android.permission.INTERNET delivery/permissions.txt; then exit 1; fi
          cp "$APK" delivery/Rosalina-Motion-Lab-V3-rc2-arm64.apk
          cp MOTION_LAB_V3.md delivery/
          cp motion/src/main/assets/tae.sha256 delivery/
          git rev-parse HEAD > delivery/commit.txt
          git archive --format=zip HEAD -o delivery/Rosalina-Motion-Lab-V3-source.zip
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
          cat > delivery/MIGRATION.txt <<'EOF'
          One-time migration from RC1:
          1) Before uninstalling RC1, use LADB:
             mkdir -p /sdcard/Download/RosalinaMotionBackup
             run-as com.rosalina.motionlab sh -c 'cd /data/user/0/com.rosalina.motionlab && tar -cf - files shared_prefs' > /sdcard/Download/RosalinaMotionBackup/rc1-data.tar
             ls -lh /sdcard/Download/RosalinaMotionBackup/rc1-data.tar
          2) Only after the backup exists, uninstall RC1 and install this APK.
          3) Restore through LADB:
             cat /sdcard/Download/RosalinaMotionBackup/rc1-data.tar | run-as com.rosalina.motionlab sh -c 'cd /data/user/0/com.rosalina.motionlab && tar -xf -'
          4) Force-stop and reopen Motion Lab.
          EOF
          python3 - <<'PY'
          import zipfile,struct,pathlib
          with zipfile.ZipFile('delivery/Rosalina-Motion-Lab-V3-rc2-arm64.apk') as z:
              libs=[n for n in z.namelist() if n.endswith('.so')]
              assert libs==['lib/arm64-v8a/librosalina-motion.so'],libs
              b=z.read(libs[0]); assert b[:4]==b'\x7fELF' and struct.unpack('<H',b[18:20])[0]==183
          PY
      - name: Seal permanent signing identity for private recovery
        shell: bash
        run: |
          set -euo pipefail
          cp signing/rosalina-motion.jks signing/private-keystore.jks
          {
            printf 'storepass='
            cat signing/storepass.txt
            printf '\nkeypass='
            cat signing/keypass.txt
            printf '\nalias=rosalina-motion\n'
          } > signing/credentials.txt
          tar -czf signing/signing-bundle.tar.gz -C signing private-keystore.jks credentials.txt
          openssl rand -hex 32 > signing/envelope.pass
          openssl enc -aes-256-cbc -salt -pbkdf2             -in signing/signing-bundle.tar.gz             -out delivery/Rosalina-Motion-signing-bundle.enc             -pass file:signing/envelope.pass
          cat > signing/wrap-public.pem <<'PEM'
-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAxVVomnaz2kCqRkQrrQZ1
jFJfxEQ2YDvosu+xevHt1tfT+aF0AAEbW5+zAwI4y4KB5H5HadIuxkGPQ23BHICc
FSryeD0+K434PdBOodXUImxxblr/cOnsMJWcIscimwgl8JmMuuM1JmAtyu6hYXh5
wMbt5/mEbguY2GaHrm/qbC3VUOghvTZVVAP58aL09AZSpq8Ax8tkrn5RH+kxEnIJ
21w8Odu+isclzSUvAgqhvkXY7Er67n4nuOoxRh7iy7K4oyP28jEsrSe/fGvOeBz6
4z2Q+5e/z0dkHKnaJHDMOWWRc8QVvtgK2h+E/7SJwuS9UdKxi7/orgmTPj49Yhsw
SXKnv4+cMeutyJ1z3XZXyU+0eFJcb5fHr2yJcAY2oSyrxDXQ2IxpkZ4Tadj0JiuL
XYQ3Lxoluy/Wx1bWOi6LDdYi/jE8q2fHIqjhFM21zHdYQ4R9nkpy7T0YcekP7Ms2
aufFKGJdAC3dTb04Hx+/DQnQJM532uPdz/9cXESyhioXfYrQ8m4SQnMZ6bEJPI34
6+JV7wYexLai3S+QhuZReoXX5frDqwPL5fvQ7JPTHrTyIg7dEd64g+U3/cKnxlQk
kXbmabh7IIfzYc1r/6KdqYOiW/Xdwjpcyv1ZfCvu11BpvRgaKbzdPpSWgt3x7owr
1/4WBUo3u26qlCwlxJZ3WOUCAwEAAQ==
-----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey signing/wrap-public.pem             -in signing/envelope.pass             -out delivery/Rosalina-Motion-signing-envelope.rsa             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256
          printf 'The signing bundle is encrypted. The unencrypted signing key is not stored in this public repository.\n' > delivery/SIGNING-RECOVERY.txt
          rm -f signing/private-keystore.jks signing/credentials.txt signing/signing-bundle.tar.gz signing/envelope.pass signing/storepass.txt signing/keypass.txt signing/rosalina-motion.jks

      - name: Bundle local APK signing utility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/signing-tools
          curl -fL --retry 4             https://github.com/agusibrahim/apksig-go/releases/download/v1.1.0/apksig-go_v1.1.0_linux_amd64.tar.gz             -o /tmp/apksig-go.tar.gz
          echo 'dda1ef085229514900a2ded2420d4f3e8e03a621cab21e922900269a53a205f7  /tmp/apksig-go.tar.gz' | sha256sum -c -
          tar -xzf /tmp/apksig-go.tar.gz -C delivery/signing-tools

      - uses: actions/upload-artifact@v4
        with:
          name: Rosalina-Motion-Lab-V3-RC2-permanent-signing
          path: delivery/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Motion-Lab-unit-tests
          path: motion/build/test-results/
  android-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android MP4 encoding, photo import and screen recreation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            gradle :motion:connectedDebugAndroidTest -PmotionCodecTest=true --max-workers=2 --stacktrace
            mkdir -p motion-ui-output
            adb exec-out run-as com.rosalina.motionlab cat files/qa/motion-photo-screen.png > motion-ui-output/motion-photo-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Motion-Lab-Android-codec-tests
          path: |
            motion/build/outputs/androidTest-results/
            motion-ui-output/
