name: Rosalina Voice3 Runtime Kit
on:
  push:
    branches: [rosalina-10015-companion-completion-c2-10018]
    paths: [.github/workflows/voice3-runtime-kit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve official Java API and JNI bridge without replacing protected ONNX core
        run: |
          mkdir -p runtime-kit
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.23.2/onnxruntime-android-1.23.2.aar -o runtime-kit/onnxruntime-android-1.23.2.aar
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o runtime-kit/json-20240303.jar
          sha256sum runtime-kit/* > runtime-kit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: Rosalina-voice3-runtime-kit, path: runtime-kit/, compression-level: 0}
