name: Export Android APK signing tool
on:
  push:
    branches: [motion-lab-v3-rc3-live-progress]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager --install "build-tools;35.0.0"
      - name: Package apksigner
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          sha256sum signing-tools/* > signing-tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools-35
          path: signing-tools/
