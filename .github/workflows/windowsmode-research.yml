name: Windows Mode - inspect native ARM64 QEMU
on:
  push:
    branches: [windows-mode-android-research]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download upstream GPL Android QEMU packaging for compatibility analysis
        run: |
          set -euo pipefail
          curl --retry 3 -fL 'https://github.com/rhn-1k/QubeVM/releases/download/7.1.4/qube-arm-q11.1.3-android-arm64-v8a-release.apk' -o /tmp/qube.apk
          echo 'Upstream APK SHA256:' | tee /tmp/windowsmode-engine-report.txt
          sha256sum /tmp/qube.apk | tee -a /tmp/windowsmode-engine-report.txt
          echo '--- Native libs ---' | tee -a /tmp/windowsmode-engine-report.txt
          unzip -Z1 /tmp/qube.apk | grep -E '^(lib/arm64-v8a/|assets/)' | head -180 | tee -a /tmp/windowsmode-engine-report.txt
          mkdir -p /tmp/qube
          unzip -qo /tmp/qube.apk 'lib/arm64-v8a/*' -d /tmp/qube
          echo '--- ELF dependencies / entrypoints ---' | tee -a /tmp/windowsmode-engine-report.txt
          for f in /tmp/qube/lib/arm64-v8a/*.so; do
             echo "===== $(basename "$f")" | tee -a /tmp/windowsmode-engine-report.txt
             readelf -h "$f" | grep -E '(Type:|Entry point address:|Machine:)' | tee -a /tmp/windowsmode-engine-report.txt
             readelf -d "$f" | grep -E '(NEEDED|SONAME)' | head -30 | tee -a /tmp/windowsmode-engine-report.txt || true
          done
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: windowsmode-engine-inspection
          path: /tmp/windowsmode-engine-report.txt
