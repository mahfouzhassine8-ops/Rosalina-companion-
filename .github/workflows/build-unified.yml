name: Rosalina Unified Candidate
on:
  push:
    branches: [rosalina-unified-v1-candidate, rosalina-voice-v2-expressive-candidate, rosalina-live-voice-candidate, rosalina-hybrid-live-candidate, rosalina-voice-c1.2-speech-repair, rosalina-c1.3-live-companion-polish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosalina-unified-${{ github.sha }}
  cancel-in-progress: true
jobs:
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify protected sources and actual parent-death cleanup
        run: |
          git diff --exit-code 2b4dbd048484e67fcc745c30ce1622cb095d3519 HEAD -- app lib
          git diff --exit-code 37bb610977054fe20626acbdc3ba14483354d578 HEAD -- studio image-engine
          git diff --exit-code 95e44a09c7aa2ccb2ad18fa7e62b746a318fb7f3 HEAD -- motion motion-engine
          python3 -m py_compile unified-native/prepare.py tools/*.py
          python3 unified-native/prepare.py /tmp/derived-workers
          python3 tools/test_parent_guard.py
          mkdir -p source-backup
          git archive --format=zip HEAD -o source-backup/Rosalina-Unified-source.zip
          git rev-parse HEAD > source-backup/commit.txt
          cp UNIFIED_AUDIT.md UNIFIED_SCOPE_CHANGE.md SIGNING.md VOICE_V2.md VOICE_V2_1_REPAIR.md LIVE_VOICE.md HYBRID_LIVE.md VOICE_C1_2_SPEECH_REPAIR.md VOICE_C1_3_LIVE_COMPANION.md source-backup/
      - uses: actions/upload-artifact@v4
        with: {name: Rosalina-Unified-source, path: source-backup/}
  native:
    name: Native ARM64 (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/cache@v4
        id: worker-cache
        with:
          path: native-output
          key: rosalina-native-v2-${{ matrix.backend }}-${{ hashFiles('unified-native/**', 'image-engine/**', 'motion-engine/**', 'tools/build_unified_native.sh') }}
      - uses: actions/checkout@v4
        if: steps.worker-cache.outputs.cache-hit != 'true'
        with: {repository: leejet/stable-diffusion.cpp, ref: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c, path: third_party/stable-diffusion.cpp, submodules: recursive, persist-credentials: false}
      - uses: actions/checkout@v4
        if: matrix.backend == 'vulkan' && steps.worker-cache.outputs.cache-hit != 'true'
        with: {repository: KhronosGroup/Vulkan-Headers, ref: 3c65a01745e4a1134d32b9c2c456472212dba16d, path: third_party/Vulkan-Headers, persist-credentials: false}
      - uses: actions/checkout@v4
        if: matrix.backend == 'vulkan' && steps.worker-cache.outputs.cache-hit != 'true'
        with: {repository: KhronosGroup/SPIRV-Headers, ref: cb42dec3830d3ac67fa449ecdc0c0f73d5e74498, path: third_party/SPIRV-Headers, persist-credentials: false}
      - uses: actions/setup-java@v4
        if: steps.worker-cache.outputs.cache-hit != 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        if: steps.worker-cache.outputs.cache-hit != 'true'
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Build isolated worker pair
        if: steps.worker-cache.outputs.cache-hit != 'true'
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -o pipefail
          mkdir -p qa
          bash tools/build_unified_native.sh "$BACKEND" 2>&1 | tee qa/native-build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Rosalina-native-${{ matrix.backend }}
          path: native-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rosalina-native-${{ matrix.backend }}-QA
          path: qa/
  android:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: ggml-org/llama.cpp, ref: a97cce86a8addeb9f40cba7a261c94b1f0c576cb, path: third_party/llama.cpp, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-read-only: false}
      - uses: actions/download-artifact@v4
        with: {name: Rosalina-native-cpu, path: unified/src/main/jniLibs/arm64-v8a}
      - uses: actions/download-artifact@v4
        with: {name: Rosalina-native-vulkan, path: unified/src/main/jniLibs/arm64-v8a}
      - name: Download verified speech runtime and bundled decoder
        run: |
          mkdir -p unified/libs unified/src/main/assets/licenses qa
          curl --fail --location --retry 3 -o unified/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo '633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  unified/libs/sherpa-onnx-1.13.8.aar' | sha256sum -c
          curl --fail --location --retry 3 -o unified/src/main/assets/taew2_2.safetensors https://raw.githubusercontent.com/madebyollin/taehv/011dfc2112197741c540e0bdd5b7b67bcc930771/safetensors/taew2_2.safetensors
          echo 'b84609b2a133d48434bd9636bfcb44bf05168dc436e2d3cecf26256faa1f5325  unified/src/main/assets/taew2_2.safetensors' | sha256sum -c
          cp tools/voice-pins.json unified/src/main/assets/voice-model-checksums.json
          cp third_party/llama.cpp/LICENSE unified/src/main/assets/licenses/llama-LICENSE
          curl --fail --location -o unified/src/main/assets/licenses/stable-diffusion-LICENSE https://raw.githubusercontent.com/leejet/stable-diffusion.cpp/3f8527a46c54ecf4cb4ed6003da8e8982283c73c/LICENSE
          curl --fail --location -o unified/src/main/assets/licenses/sherpa-LICENSE https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/LICENSE
          curl --fail --location -o unified/src/main/assets/licenses/taehv-LICENSE https://raw.githubusercontent.com/madebyollin/taehv/011dfc2112197741c540e0bdd5b7b67bcc930771/LICENSE
          git rev-parse HEAD > unified/src/main/assets/source-commit.txt
      - name: Kotlin tests and unsigned ARM64 release
        run: |
          set -o pipefail
          gradle :unified:testReleaseUnitTest :unified:assembleRelease --max-workers=2 --stacktrace 2>&1 | tee qa/gradle-build.log
      - name: Verify actual packaging without a disposable release key
        run: |
          set -euo pipefail
          mkdir -p deliverables/signing-tools
          cp unified/build/outputs/apk/release/unified-release-unsigned.apk deliverables/Rosalina-Unified-Adaptive-Hybrid-C1.3-arm64-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions deliverables/*.apk | tee qa/permissions.txt
          grep -q android.permission.INTERNET qa/permissions.txt
          grep -q android.permission.ACCESS_NETWORK_STATE qa/permissions.txt
          grep -q android.permission.BLUETOOTH_CONNECT qa/permissions.txt
          ! grep -q android.permission.BLUETOOTH_SCAN qa/permissions.txt
          ! grep -q android.permission.ACCESS_FINE_LOCATION qa/permissions.txt
          ! grep -R -E "sk-[A-Za-z0-9_-]{16,}" unified/src/main || false
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging deliverables/*.apk > qa/package.txt
          python3 tools/verify_unified_apk.py deliverables/Rosalina-Unified-Adaptive-Hybrid-C1.3-arm64-UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" deliverables/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" deliverables/signing-tools/
          cp -r qa deliverables/
          cp UNIFIED_AUDIT.md UNIFIED_SCOPE_CHANGE.md SIGNING.md VOICE_C1_2_SPEECH_REPAIR.md VOICE_C1_3_LIVE_COMPANION.md deliverables/
          git rev-parse HEAD > deliverables/commit.txt
          sha256sum deliverables/*.apk > deliverables/SHA256SUMS-UNSIGNED.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with: {name: Rosalina-Unified-ARM64-unsigned, path: deliverables/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rosalina-Unified-build-QA
          path: |
            unified/build/test-results/
            qa/
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-read-only: false}
      - name: Compile lifecycle and codec test package
        run: |
          set -o pipefail
          mkdir -p unified/libs qa
          curl --fail --location --retry 3 -o unified/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo '633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  unified/libs/sherpa-onnx-1.13.8.aar' | sha256sum -c
          gradle :unified:testDebugUnitTest :unified:assembleDebug :unified:assembleDebugAndroidTest -PunifiedEmulatorQa=true --max-workers=2 --stacktrace 2>&1 | tee qa/emulator-build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/emulator_qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rosalina-Unified-emulator-QA
          path: |
            unified/build/outputs/androidTest-results/
            unified/build/test-results/
            qa/
  host-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/cache@v4
        id: host-images-cache
        with:
          path: qa/images
          key: rosalina-host-images-v2-${{ hashFiles('unified-native/**', 'image-engine/**', 'tools/host_images.py') }}
      - uses: actions/checkout@v4
        if: steps.host-images-cache.outputs.cache-hit != 'true'
        with: {repository: leejet/stable-diffusion.cpp, ref: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c, path: third_party/stable-diffusion.cpp, submodules: recursive, persist-credentials: false}
      - name: Real host Create, Edit and Standard image generation
        if: steps.host-images-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S unified-native -B native-host -G Ninja -DSD_SOURCE="$PWD/third_party/stable-diffusion.cpp" -DCMAKE_BUILD_TYPE=Release
          cmake --build native-host --target rosalina-image --parallel 2
          mkdir -p models
          curl --fail --location --retry 3 -o models/sd15.gguf https://huggingface.co/second-state/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf
          echo 'b8944e9fe0b69b36ae1b5bb0185b3a7b8ef14347fe0fa9af6c64c4829022261f  models/sd15.gguf' | sha256sum -c
          python3 -m pip install pillow
          python3 tools/host_images.py "$PWD/native-host/rosalina-image" "$PWD/models/sd15.gguf"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Rosalina-Unified-host-images, path: qa/}
  host-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python3 -m pip install sherpa-onnx==1.13.8 soundfile numpy
          python3 tools/voice_models.py --benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Rosalina-Unified-host-voice, path: qa/}
