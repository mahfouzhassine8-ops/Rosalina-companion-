name: Windows ARM64 QEMU - WinJIT actual system guest boot micro-smoke (NO APK)
on:
  push:
    branches: [windows-arm64-qemu-accel-research]
    paths:
      - '.github/workflows/windows-arm64-qemu-winjit-boot-smoke.yml'
      - 'engineering/windows-arm64-accelerator/qemu_winjit_accel.c'
      - 'engineering/windows-arm64-accelerator/qemu_arm_snapshot.c'
      - 'engineering/windows-arm64-accelerator/qemu_phys_io.c'
      - 'engineering/windows-arm64-accelerator/jit_region_android.c'
      - 'engineering/windows-arm64-accelerator/port-windowsios-core-android.py'
      - 'engineering/windows-arm64-accelerator/winjit_cpu_bridge.h'
      - 'engineering/windows-arm64-accelerator/winjit_cpu_bridge.c'
      - 'engineering/windows-arm64-accelerator/patch_qemu_virt_winjit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-arm64-winjit-microguest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect Windows Mode 7.1.14 and installed Windows storage
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin windows-mode-android-research
          test "$(git rev-parse FETCH_HEAD)" = 68c0b948b89ab03c5f5b010a2e35b99e69339e1d
          git diff --name-only FETCH_HEAD HEAD > /tmp/research-change-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          paths=Path('/tmp/research-change-paths.txt').read_text().splitlines()
          assert paths and all(
              p.startswith('engineering/windows-arm64-accelerator/')
              or p.startswith('.github/workflows/windows-arm64-')
              for p in paths
          ), paths
          print('PASS: protected app source unchanged; no Windows storage accessed')
          PY
      - name: Install ARM64 Linux QEMU development prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld binutils git python3 python3-venv \
            meson ninja-build pkg-config libglib2.0-dev libpixman-1-dev \
            libfdt-dev libslirp-dev zlib1g-dev libffi-dev libcapstone-dev gdb
      - name: Pin QEMU 11.1.3 and upstream WindowsiOS ARM64 translator
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v11.1.3 https://github.com/qemu/qemu.git /tmp/winjit-qemu
          git init -q /tmp/winjit-core
          git -C /tmp/winjit-core remote add origin https://github.com/ammaarreshi/WindowsiOS.git
          git -C /tmp/winjit-core -c advice.detachedHead=false fetch -q --depth=1 origin 0071d6975287fd720b9046dfd3bd80b6f2aa765e
          git -C /tmp/winjit-core checkout -q FETCH_HEAD
          test "$(git -C /tmp/winjit-core rev-parse HEAD)" = 0071d6975287fd720b9046dfd3bd80b6f2aa765e
          python3 engineering/windows-arm64-accelerator/port-windowsios-core-android.py /tmp/winjit-core
      - name: Build full native WinJIT ARM64 translator shared library on Linux
        run: |
          set -euo pipefail
          mkdir -p /tmp/winjit-obj /tmp/winjit-test-out /tmp/winjit-lib
          SRC=/tmp/winjit-core
          for f in "$SRC"/core/*.c; do
            n=$(basename "$f" .c)
            EXTRA=""
            if [ "$n" = mmu ]; then EXTRA=-mgeneral-regs-only; fi
            clang -std=gnu11 -O2 -fPIC -D_GNU_SOURCE \
              -Werror=implicit-function-declaration -I "$SRC/core" -I "$SRC/host" \
              $EXTRA -c "$f" -o "/tmp/winjit-obj/$n.o"
          done
          clang -fPIC -c "$SRC/host/enter.S" -o /tmp/winjit-obj/enter.o
          for n in jit_region_android winjit_cpu_bridge winjit_phys_bus; do
            clang -std=gnu11 -O2 -fPIC -D_GNU_SOURCE \
              -I "$SRC/core" -I "$SRC/host" -I engineering/windows-arm64-accelerator \
              -c "engineering/windows-arm64-accelerator/$n.c" -o "/tmp/winjit-obj/$n.o"
          done
          clang -shared -fPIC -Wl,--no-undefined -Wl,-z,relro -Wl,-z,now \
            /tmp/winjit-obj/*.o -lm -pthread \
            -o /tmp/winjit-lib/libwinjit-core-android-aarch64.so
          test -s /tmp/winjit-lib/libwinjit-core-android-aarch64.so
          readelf -h /tmp/winjit-lib/libwinjit-core-android-aarch64.so | grep -F AArch64
      - name: Compile full QEMU system emulator with actual -accel winjit vCPU backend
        timeout-minutes: 30
        run: |
          set -euo pipefail
          Q=/tmp/winjit-qemu
          cp engineering/windows-arm64-accelerator/qemu_arm_snapshot.c "$Q/target/arm/winjit_qemu_snapshot.c"
          cp engineering/windows-arm64-accelerator/qemu_phys_io.c "$Q/target/arm/winjit_qemu_phys_io.c"
          cp engineering/windows-arm64-accelerator/qemu_winjit_accel.c "$Q/target/arm/winjit_qemu_accel.c"
          cp engineering/windows-arm64-accelerator/winjit_cpu_bridge.h "$Q/target/arm/winjit_cpu_bridge.h"
          cp engineering/windows-arm64-accelerator/winjit_phys_bus.h "$Q/target/arm/winjit_phys_bus.h"
          mkdir -p "$Q/target/arm/winjit_pinned"
          cp /tmp/winjit-core/core/cpu.h /tmp/winjit-core/core/machine.h \
             /tmp/winjit-core/core/dispatch.h /tmp/winjit-core/host/jit_region.h \
             "$Q/target/arm/winjit_pinned/"
          python3 - "$Q/target/arm/winjit_pinned/machine.h" "$Q/target/arm/meson.build" <<'PY'
          from pathlib import Path
          import sys
          m=Path(sys.argv[1])
          s=m.read_text()
          if '#include <TargetConditionals.h>' in s:
              assert s.count('#include <TargetConditionals.h>')==1
              m.write_text(s.replace('#include <TargetConditionals.h>','#define TARGET_OS_IPHONE 0'))
          else:
              assert '#define TARGET_OS_IPHONE 0' in s, 'Unexpected pinned WinJIT machine header'
          p=Path(sys.argv[2])
          s=p.read_text()
          anchor="target_common_system_arch += {'arm': arm_common_system_ss}"
          assert s.count(anchor)==1
          new="arm_common_system_ss.add(when: 'TARGET_AARCH64', if_true: files('winjit_qemu_snapshot.c', 'winjit_qemu_phys_io.c', 'winjit_qemu_accel.c'))\n"
          p.write_text(s.replace(anchor,new+anchor))
          PY
          python3 engineering/windows-arm64-accelerator/patch_qemu_virt_winjit.py "$Q"
          cd "$Q"
          ./configure --target-list=aarch64-softmmu --disable-docs \
            --disable-gtk --disable-sdl --disable-vnc --disable-werror \
            --disable-debug-info --enable-slirp
          make -j4 qemu-system-aarch64 2>&1 | tee /tmp/winjit-test-out/qemu-linux-build.log
          test -x ./build/qemu-system-aarch64
          ./build/qemu-system-aarch64 -accel help | tee /tmp/winjit-test-out/accel-help.txt
          grep -Fq winjit /tmp/winjit-test-out/accel-help.txt

      - name: Boot ROM microguest through real QEMU -accel winjit and verify UART
        run: |
          set -euo pipefail
          cat > /tmp/winjit-test-out/guest.s <<'ASM'
          .section .text
          .global _start
          _start:
              movz x1, #0x0000
              movk x1, #0x0900, lsl #16
              movz w0, #79
              strb w0, [x1]
              movz w0, #75
              strb w0, [x1]
              movz w0, #10
              strb w0, [x1]
          forever:
              b forever
          ASM
          clang -c /tmp/winjit-test-out/guest.s -o /tmp/winjit-test-out/guest.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/guest.elf /tmp/winjit-test-out/guest.o
          objcopy -O binary /tmp/winjit-test-out/guest.elf /tmp/winjit-test-out/guest.bin
          cd /tmp/winjit-qemu
          set +e
          # Run under native ARM64 GDB to capture the first crash and
          # prevent the earlier false green (UART said OK but QEMU aborted 134).
          LD_LIBRARY_PATH=/tmp/winjit-lib:${LD_LIBRARY_PATH:-} \
          timeout --signal=TERM --kill-after=3s 22s \
          gdb --quiet --batch \
            -ex 'set pagination off' \
            -ex 'handle SIGPIPE nostop noprint pass' \
            -ex run -ex 'thread apply all bt 20' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off -cpu cortex-a53 \
            -smp 1 -m 128M -bios /tmp/winjit-test-out/guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/guest.log 2>&1
          EXIT=$?
          set -e
          cat /tmp/winjit-test-out/guest.log
          echo "GUEST_EXIT=$EXIT" | tee /tmp/winjit-test-out/STATUS.txt
          if grep -Eiq '(Program received signal SIG|Aborted|core dumped|assertion.*failed|SIGSEGV)' /tmp/winjit-test-out/guest.log; then
            echo 'FAIL: guest emitted data but QEMU crashed; no valid boot pass' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          if ! grep -Fxq 'OK' /tmp/winjit-test-out/guest.log; then
            echo 'FAIL: actual QEMU WinJIT guest UART output unverified' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          # Guest is an intentional infinite loop; stable timeout is expected.
          # A clean exit is also acceptable; abort or other exit is NOT.
          if [ "$EXIT" -ne 124 ] && [ "$EXIT" -ne 0 ]; then
            echo "FAIL: unexpected guest process termination $EXIT" >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          echo 'PASS: real QEMU -accel winjit emitted UART and did not crash' >> /tmp/winjit-test-out/STATUS.txt
          echo 'NOT VERIFIED: Android Fold, Windows guest, QEMU GIC interrupts, DMA, migration, thermal, stability' >> /tmp/winjit-test-out/STATUS.txt

      - name: Execute guest EL1-to-EL0 exception return and user UART (NO WINDOWS)
        run: |
          set -euo pipefail
          cat > /tmp/winjit-test-out/user-guest.s <<'ASM'
          .section .text
          .global _start
          _start:
              adr x0, user_entry
              msr elr_el1, x0
              movz x0, #0
              msr spsr_el1, x0
              movz x0, #0x4000
              msr sp_el0, x0
              eret
          user_entry:
              movz x1, #0
              movk x1, #0x900, lsl #16
              movz w0, #85
              strb w0, [x1]
              movz w0, #83
              strb w0, [x1]
              movz w0, #69
              strb w0, [x1]
              movz w0, #82
              strb w0, [x1]
              movz w0, #10
              strb w0, [x1]
          idle:
              b idle
          ASM
          clang -c /tmp/winjit-test-out/user-guest.s -o /tmp/winjit-test-out/user-guest.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/user-guest.elf /tmp/winjit-test-out/user-guest.o
          objcopy -O binary /tmp/winjit-test-out/user-guest.elf /tmp/winjit-test-out/user-guest.bin
          cd /tmp/winjit-qemu
          set +e
          LD_LIBRARY_PATH=/tmp/winjit-lib \
          timeout --signal=TERM --kill-after=3s 18s \
          gdb --quiet --batch -ex 'set pagination off' -ex run \
            -ex 'thread apply all bt 20' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off -cpu cortex-a53 \
            -smp 1 -m 128M -bios /tmp/winjit-test-out/user-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/user-guest.log 2>&1
          EXIT=$?
          set -e
          cat /tmp/winjit-test-out/user-guest.log
          echo "USER_GUEST_EXIT=$EXIT" | tee -a /tmp/winjit-test-out/STATUS.txt
          if grep -Eiq '(Program received signal SIG|Aborted|core dumped|assertion.*failed|SIGSEGV)' /tmp/winjit-test-out/user-guest.log; then
            echo 'FAIL: EL0 user guest crashed' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          if ! grep -Fxq 'USER' /tmp/winjit-test-out/user-guest.log ||
             { [ "$EXIT" -ne 124 ] && [ "$EXIT" -ne 0 ]; }; then
            echo 'FAIL: actual EL0 guest instruction path unverified' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          echo 'PASS: QEMU WinJIT guest EL1-to-EL0 ERET and user instructions executed stably' >> /tmp/winjit-test-out/STATUS.txt
          echo 'NOT VERIFIED: Windows boot, user application compatibility, Android Fold or GIC interrupts' >> /tmp/winjit-test-out/STATUS.txt

      - name: Verify 4KB EL1 page table and MMU enable in real QEMU WinJIT
        run: |
          set -euo pipefail
          # Compare identical bare-metal page-table program under TCG and WinJIT.
          # ROM table at IPA 0x1000 maps first 1 GiB at EL1, AttrIdx0=0xff.
          cat > /tmp/winjit-test-out/mmu-guest.s <<'ASM'
          .section .text
          .global _start
          _start:
              adr x2, l1_table
              msr ttbr0_el1, x2
              movz x3, #0x3519
              movk x3, #0x80, lsl #16
              msr tcr_el1, x3
              movz x3, #0xff
              msr mair_el1, x3
              dsb sy
              isb
              mrs x3, sctlr_el1
              orr x3, x3, #1
              msr sctlr_el1, x3
              isb
              movz x1, #0
              movk x1, #0x900, lsl #16
              movz w0, #77
              strb w0, [x1]
              movz w0, #77
              strb w0, [x1]
              movz w0, #85
              strb w0, [x1]
              movz w0, #10
              strb w0, [x1]
          hang:
              b hang
          .balign 4096
          l1_table:
              .quad 0x701
              .fill 511,8,0
          ASM
          clang -c /tmp/winjit-test-out/mmu-guest.s -o /tmp/winjit-test-out/mmu-guest.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/mmu-guest.elf /tmp/winjit-test-out/mmu-guest.o
          objcopy -O binary /tmp/winjit-test-out/mmu-guest.elf /tmp/winjit-test-out/mmu-guest.bin
          cd /tmp/winjit-qemu
          set +e
          timeout --signal=TERM --kill-after=2s 10s \
          ./build/qemu-system-aarch64 -accel tcg \
            -machine virt,gic-version=2,secure=off,virtualization=off -cpu cortex-a53 \
            -smp 1 -m 128M -bios /tmp/winjit-test-out/mmu-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/mmu-tcg.log 2>&1
          TCG_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/mmu-tcg.log
          if [ "$TCG_EXIT" -ne 124 ] ||
             ! grep -Fxq MMU /tmp/winjit-test-out/mmu-tcg.log; then
            echo 'FAIL: TCG control of 4KB stage-1 MMU test did not pass'
            exit 1
          fi
          set +e
          LD_LIBRARY_PATH=/tmp/winjit-lib \
          timeout --signal=TERM --kill-after=2s 12s \
          gdb --quiet --batch -ex 'set pagination off' -ex run \
            -ex 'thread apply all bt 12' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off -cpu cortex-a53 \
            -smp 1 -m 128M -bios /tmp/winjit-test-out/mmu-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/mmu-winjit.log 2>&1
          WINJIT_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/mmu-winjit.log
          echo "MMU_TCG_EXIT=$TCG_EXIT MMU_WINJIT_EXIT=$WINJIT_EXIT" \
            >> /tmp/winjit-test-out/STATUS.txt
          if [ "$WINJIT_EXIT" -ne 124 ] ||
             ! grep -Fxq MMU /tmp/winjit-test-out/mmu-winjit.log ||
             grep -Eiq '(Program received signal SIG|Aborted|core dumped|assertion.*failed|SIGSEGV)' \
               /tmp/winjit-test-out/mmu-winjit.log; then
            echo 'FAIL: WinJIT 4KB stage-1 EL1 MMU does not match TCG control' \
              >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          echo 'PASS: stage-1 4KB EL1 MMU identity mapping executed in QEMU WinJIT' \
            >> /tmp/winjit-test-out/STATUS.txt

      - name: Differential-test TCR/MAIR sysreg writes via stolen and normal GPRs
        run: |
          set -euo pipefail
          # Linux writes TCR_EL1 and MAIR_EL1 from several source registers.
          # Pinpoint guest GPR / helper corruption by comparing with QEMU TCG.
          cat > /tmp/winjit-test-out/sysreg-guest.s <<'ASM'
          .section .text
          .global _start
          _start:
              movz x11, #0
              movk x11, #0x900, lsl #16
          .macro TCR_TEST reg, sym
              movz x9, #\sym
              movz \reg, #0x3519
              movk \reg, #0x80, lsl #16
              msr tcr_el1, \reg
              mrs x4, tcr_el1
              cmp x4, \reg
              b.ne failed
          .endm
          .macro MAIR_TEST reg, sym
              movz x9, #\sym
              movz \reg, #0xff44
              movk \reg, #0xaa55, lsl #16
              msr mair_el1, \reg
              mrs x4, mair_el1
              cmp x4, \reg
              b.ne failed
          .endm
              TCR_TEST x0, 65
              TCR_TEST x1, 66
              TCR_TEST x6, 67
              TCR_TEST x7, 68
              TCR_TEST x15, 69
              TCR_TEST x16, 83
              TCR_TEST x17, 84
              TCR_TEST x18, 70
              TCR_TEST x19, 71
              TCR_TEST x28, 72
              TCR_TEST x30, 73
              MAIR_TEST x0, 74
              MAIR_TEST x1, 75
              MAIR_TEST x6, 76
              MAIR_TEST x7, 77
              MAIR_TEST x15, 78
              MAIR_TEST x16, 85
              MAIR_TEST x17, 86
              MAIR_TEST x18, 79
              MAIR_TEST x19, 80
              MAIR_TEST x28, 81
              MAIR_TEST x30, 82
              movz w0, #71
              strb w0, [x11]
              movz w0, #79
              strb w0, [x11]
              strb w0, [x11]
              movz w0, #68
              strb w0, [x11]
              movz w0, #10
              strb w0, [x11]
          loop:
              b loop
          failed:
              movz w0, #70
              strb w0, [x11]
              strb w9, [x11]
              movz w0, #10
              strb w0, [x11]
          bad_loop:
              b bad_loop
          ASM
          clang -c /tmp/winjit-test-out/sysreg-guest.s -o /tmp/winjit-test-out/sysreg-guest.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/sysreg-guest.elf /tmp/winjit-test-out/sysreg-guest.o
          objcopy -O binary /tmp/winjit-test-out/sysreg-guest.elf /tmp/winjit-test-out/sysreg-guest.bin
          cd /tmp/winjit-qemu
          set +e
          timeout --signal=TERM --kill-after=3s 8s \
            ./build/qemu-system-aarch64 -accel tcg \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu cortex-a53 -smp 1 -m 128M \
            -bios /tmp/winjit-test-out/sysreg-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/sysreg-tcg.log 2>&1
          TCG_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/sysreg-tcg.log
          if [ "$TCG_EXIT" -ne 124 ] ||
             ! grep -Fxq GOOD /tmp/winjit-test-out/sysreg-tcg.log; then
            echo 'FAIL: TCG sysreg/GPR control not valid' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          set +e
          LD_LIBRARY_PATH=/tmp/winjit-lib \
          timeout --signal=TERM --kill-after=3s 10s \
            gdb --quiet --batch -ex run -ex 'thread apply all bt 12' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu cortex-a53 -smp 1 -m 128M \
            -bios /tmp/winjit-test-out/sysreg-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/sysreg-winjit.log 2>&1
          WINJIT_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/sysreg-winjit.log
          echo "SYSREG_TCG_EXIT=$TCG_EXIT SYSREG_WINJIT_EXIT=$WINJIT_EXIT" >> /tmp/winjit-test-out/STATUS.txt
          if [ "$WINJIT_EXIT" -ne 124 ] ||
             ! grep -Fxq GOOD /tmp/winjit-test-out/sysreg-winjit.log ||
             grep -Eiq '(Program received signal SIG|Aborted|core dumped|assertion.*failed|SIGSEGV)' \
               /tmp/winjit-test-out/sysreg-winjit.log; then
            echo 'FAIL: WinJIT TCR/MAIR system register write/readback diverged from TCG; inspect fail letter' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          echo 'PASS: QEMU WinJIT TCR/MAIR sysreg matrix matches TCG for normal and borrowed GPRs' \
            >> /tmp/winjit-test-out/STATUS.txt

      - name: Differential-test guest memory loads into ARM64 TCR and MAIR
        run: |
          set -euo pipefail
          # Linux obtains sysreg values through guest memory loads and address
          # calculations. Validate the *actual value*, not just MSR/MRS
          # roundtrip, against identical TCG guest instruction execution.
          cat > /tmp/winjit-test-out/loadsys-guest.s <<'ASM'
          .section .text
          .global _start
          _start:
              movz x11, #0
              movk x11, #0x900, lsl #16
              movz x9, #0x3519
              movk x9, #0x80, lsl #16
              movz x12, #0xff44
              movk x12, #0xaa55, lsl #16
              adrp x2, values
              add x2, x2, :lo12:values
              // Probe guest x16/x17 loads *before* any MMU MSR helper call.
              // Later F/G/H/I markers distinguish post-helper corruption.
              movz x10, #74
              ldr x16, [x2]
              cmp x16, x9
              b.ne bad
              movz x10, #75
              ldr x17, [x2, #8]
              cmp x17, x12
              b.ne bad
              movz x10, #65
              ldr x0, [x2]
              cmp x0, x9
              b.ne bad
              msr tcr_el1, x0
              mrs x4, tcr_el1
              cmp x4, x9
              b.ne bad
              movz x10, #66
              ldr x6, [x2]
              cmp x6, x9
              b.ne bad
              msr tcr_el1, x6
              mrs x4, tcr_el1
              cmp x4, x9
              b.ne bad
              movz x10, #67
              ldr x28, [x2, #8]
              cmp x28, x12
              b.ne bad
              msr mair_el1, x28
              mrs x4, mair_el1
              cmp x4, x12
              b.ne bad
              movz x10, #68
              ldr x7, values
              cmp x7, x9
              b.ne bad
              msr tcr_el1, x7
              mrs x4, tcr_el1
              cmp x4, x9
              b.ne bad
              movz x10, #69
              ldp x0, x1, [x2]
              cmp x0, x9
              b.ne bad
              cmp x1, x12
              b.ne bad
              msr mair_el1, x1
              mrs x4, mair_el1
              cmp x4, x12
              b.ne bad
              // Linux's first failing MMU writes use x17 (MAIR) and x16 (TCR).
              // Test both memory-loaded values, not only immediate MOVZ/MOVK.
              movz x10, #70
              ldr x16, [x2]
              cmp x16, x9
              b.ne bad
              movz x10, #72
              msr tcr_el1, x16
              mrs x4, tcr_el1
              cmp x4, x9
              b.ne bad
              movz x10, #71
              ldr x17, [x2, #8]
              cmp x17, x12
              b.ne bad
              movz x10, #73
              msr mair_el1, x17
              mrs x4, mair_el1
              cmp x4, x12
              b.ne bad
              movz w0, #76
              strb w0, [x11]
              movz w0, #79
              strb w0, [x11]
              movz w0, #65
              strb w0, [x11]
              movz w0, #68
              strb w0, [x11]
              movz w0, #10
              strb w0, [x11]
          idle:
              b idle
          bad:
              movz w0, #70
              strb w0, [x11]
              strb w10, [x11]
              movz w0, #10
              strb w0, [x11]
          bad_idle:
              b bad_idle
          .balign 16
          values:
              .quad 0x0000000000803519
              .quad 0x00000000aa55ff44
          ASM
          clang -c /tmp/winjit-test-out/loadsys-guest.s -o /tmp/winjit-test-out/loadsys-guest.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/loadsys-guest.elf /tmp/winjit-test-out/loadsys-guest.o
          objcopy -O binary /tmp/winjit-test-out/loadsys-guest.elf /tmp/winjit-test-out/loadsys-guest.bin
          cd /tmp/winjit-qemu
          set +e
          timeout --signal=TERM --kill-after=3s 8s \
            ./build/qemu-system-aarch64 -accel tcg \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu cortex-a53 -smp 1 -m 128M \
            -bios /tmp/winjit-test-out/loadsys-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/loadsys-tcg.log 2>&1
          TCG_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/loadsys-tcg.log
          if [ "$TCG_EXIT" -ne 124 ] ||
             ! grep -Fxq LOAD /tmp/winjit-test-out/loadsys-tcg.log; then
            echo 'FAIL: guest memory-load test itself failed stable QEMU TCG' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          set +e
          LD_LIBRARY_PATH=/tmp/winjit-lib \
          timeout --signal=TERM --kill-after=3s 10s \
            gdb --quiet --batch -ex run -ex 'thread apply all bt 12' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu cortex-a53 -smp 1 -m 128M \
            -bios /tmp/winjit-test-out/loadsys-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/loadsys-winjit.log 2>&1
          WINJIT_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/loadsys-winjit.log
          echo "LOADSYS_TCG_EXIT=$TCG_EXIT LOADSYS_WINJIT_EXIT=$WINJIT_EXIT" \
            >> /tmp/winjit-test-out/STATUS.txt
          if [ "$WINJIT_EXIT" -ne 124 ] ||
             ! grep -Fxq LOAD /tmp/winjit-test-out/loadsys-winjit.log ||
             grep -Eiq '(Program received signal SIG|Aborted|core dumped|assertion.*failed|SIGSEGV)' \
               /tmp/winjit-test-out/loadsys-winjit.log; then
            echo 'FAIL: WinJIT memory-derived TCR/MAIR value differs from QEMU TCG; inspect diagnostic failure letter' >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          echo 'PASS: WinJIT guest memory loads and sysreg writes matched TCG' \
            >> /tmp/winjit-test-out/STATUS.txt

      - name: Differential-test QEMU generic timer IRQ and WFI wakeup through GICv2
        run: |
          set -euo pipefail
          cat > /tmp/winjit-test-out/timer.s <<'ASM'
          .text
          .global _start
          _start:
              mov x11, #0x09000000
              mov x12, #0x08010000
              mov x13, #0x08000000
              adr x0, vectors
              msr vbar_el1, x0
              mov w0, #1
              str w0, [x13]
              str w0, [x12]
              mov w0, #255
              str w0, [x12, #4]
              mov w0, #0x40000000
              str w0, [x13, #0x100]
              mrs x0, cntfrq_el0
              lsr x0, x0, #4
              msr cntp_tval_el0, x0
              mov x0, #1
              msr cntp_ctl_el0, x0
              isb
              msr daifclr, #2
          wait:
              wfi
              b wait
          .balign 2048
          vectors:
              .space 0x280
              b irq_handler
              .space 0x400-0x284
          irq_handler:
              ldr w14, [x12, #0xc]
              and w0, w14, #0x3ff
              cmp w0, #30
              b.ne bad_timer
              mov x0, #0
              msr cntp_ctl_el0, x0
              str w14, [x12, #0x10]
              mov w0, #84
              strb w0, [x11]
              mov w0, #73
              strb w0, [x11]
              mov w0, #77
              strb w0, [x11]
              mov w0, #69
              strb w0, [x11]
              mov w0, #82
              strb w0, [x11]
              mov w0, #10
              strb w0, [x11]
          timer_idle:
              b timer_idle
          bad_timer:
              mov w0, #70
              strb w0, [x11]
              b timer_idle
          ASM
          clang -c /tmp/winjit-test-out/timer.s -o /tmp/winjit-test-out/timer.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/timer.elf /tmp/winjit-test-out/timer.o
          objcopy -O binary /tmp/winjit-test-out/timer.elf /tmp/winjit-test-out/timer.bin
          cd /tmp/winjit-qemu
          for ENGINE in tcg winjit; do
            set +e
            LD_LIBRARY_PATH=/tmp/winjit-lib timeout --signal=TERM --kill-after=2s 8s \
              ./build/qemu-system-aarch64 -accel "$ENGINE" \
              -machine virt,gic-version=2,secure=off,virtualization=off \
              -cpu cortex-a53 -smp 1 -m 128M -bios /tmp/winjit-test-out/timer.bin \
              -nographic -monitor none -serial stdio \
              > "/tmp/winjit-test-out/timer-$ENGINE.log" 2>&1
            RESULT=$?
            set -e
            cat "/tmp/winjit-test-out/timer-$ENGINE.log"
            test "$RESULT" -eq 124
            grep -Fx TIMER "/tmp/winjit-test-out/timer-$ENGINE.log"
            if grep -Eiq '(stopped safely|unhandled guest exit|Aborted|core dumped|SIGSEGV|assertion.*failed)' "/tmp/winjit-test-out/timer-$ENGINE.log"; then exit 1; fi
          done
          echo 'PASS: real QEMU timer IRQ30, GICv2 acknowledge/EOI and WFI wakeup matched TCG' >> /tmp/winjit-test-out/STATUS.txt

      - name: Match production Windows Mode CPU/RAM profile on a disposable microguest
        run: |
          set -euo pipefail
          # 7.1.14 Fold logs use -M virt -cpu max -smp 4 -m 6144.
          # We MUST not claim that Cortex-A53/1-vCPU/512MB smoke success
          # demonstrates production profile compatibility.
          # Only use a synthetic ROM here, never the installed Windows disk.
          # GICv2 is explicitly retained because the current research
          # accelerator lacks verified GICv3 support. This is still NOT the
          # actual full Windows profile (UEFI, NVMe, display, USB, GIC vary).
          cat > /tmp/winjit-test-out/highram.s <<'ASM'
          .text
          .global _start
          _start:
              mov x1, #0x09000000
              mov x2, #0x40000000
              movk x2, #1, lsl #32
              mov x3, #0x1234
              movk x3, #0xabcd, lsl #48
              str x3, [x2]
              ldr x16, [x2]
              cmp x16, x3
              b.ne bad_high
              // Low and high addresses must not alias through uint32 truncation.
              mov x4, #0x40000000
              mov x5, #0x5678
              str x5, [x4]
              ldr x17, [x2]
              cmp x17, x3
              b.ne bad_high
              ldr x17, [x4]
              cmp x17, x5
              b.ne bad_high
              mov w0, #79
              strb w0, [x1]
              mov w0, #75
              strb w0, [x1]
              mov w0, #10
              strb w0, [x1]
          idle_high:
              b idle_high
          bad_high:
              mov w0, #70
              strb w0, [x1]
              b idle_high
          ASM
          clang -c /tmp/winjit-test-out/highram.s -o /tmp/winjit-test-out/highram.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/highram.elf /tmp/winjit-test-out/highram.o
          objcopy -O binary /tmp/winjit-test-out/highram.elf /tmp/winjit-test-out/highram.bin
          cd /tmp/winjit-qemu
          set +e
          timeout --signal=TERM --kill-after=2s 12s \
            ./build/qemu-system-aarch64 -accel tcg \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu max -smp 4 -m 6144 \
            -bios /tmp/winjit-test-out/highram.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/profile-tcg.log 2>&1
          TCG_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/profile-tcg.log
          printf 'PROFILE_TCG_EXIT=%s\n' "$TCG_EXIT" >> /tmp/winjit-test-out/STATUS.txt
          if [ "$TCG_EXIT" -ne 124 ] ||
             ! grep -Fxq 'OK' /tmp/winjit-test-out/profile-tcg.log; then
            echo 'FAIL: production-like test profile itself does not boot under TCG' \
              >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          set +e
          LD_LIBRARY_PATH=/tmp/winjit-lib \
          timeout --signal=TERM --kill-after=3s 14s \
            gdb --quiet --batch -ex run -ex 'thread apply all bt 12' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu max -smp 4 -m 6144 \
            -bios /tmp/winjit-test-out/highram.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/profile-winjit.log 2>&1
          WINJIT_EXIT=$?
          set -e
          cat /tmp/winjit-test-out/profile-winjit.log
          printf 'PROFILE_WINJIT_EXIT=%s\n' "$WINJIT_EXIT" >> /tmp/winjit-test-out/STATUS.txt
          if [ "$WINJIT_EXIT" -ne 124 ] ||
             ! grep -Fxq 'OK' /tmp/winjit-test-out/profile-winjit.log ||
             grep -Eiq '(Program received signal SIG|Aborted|core dumped|assertion.*failed|SIGSEGV|unhandled guest exit)' \
               /tmp/winjit-test-out/profile-winjit.log; then
            echo 'FAIL: WinJIT diverges from TCG with 4 vCPU, 6GB RAM and CPU=max' \
              >> /tmp/winjit-test-out/STATUS.txt
            exit 1
          fi
          echo 'PASS: WinJIT synthetic ROM executes with 4 vCPU, CPU=max, 6GB RAM' \
            >> /tmp/winjit-test-out/STATUS.txt
          echo 'NOT VERIFIED: Windows UEFI, NVMe, graphics, GICv3, installed disk, Fold' \
            >> /tmp/winjit-test-out/STATUS.txt

      - name: Compare QEMU CPU identity and counter frequency across TCG and WinJIT
        run: |
          set -euo pipefail
          # Same Cortex-A53 1-vCPU QEMU config, three architectural register
          # reads: MIDR_EL1, ID_AA64PFR0_EL1, CNTFRQ_EL0.
          cat > /tmp/winjit-test-out/id-guest.s <<'ASM'
          .section .text
          .global _start
          _start:
              movz x11, #0
              movk x11, #0x900, lsl #16
              mrs x0, midr_el1
              bl printhex
              mrs x0, id_aa64pfr0_el1
              bl printhex
              mrs x0, cntfrq_el0
              bl printhex
          idle:
              b idle
          printhex:
              movz w1, #16
          nibble:
              lsr x3, x0, #60
              cmp w3, #9
              b.le digit
              add w3, w3, #7
          digit:
              add w3, w3, #48
              strb w3, [x11]
              lsl x0, x0, #4
              subs w1, w1, #1
              b.ne nibble
              movz w3, #10
              strb w3, [x11]
              ret
          ASM
          clang -c /tmp/winjit-test-out/id-guest.s -o /tmp/winjit-test-out/id-guest.o
          ld.lld -Ttext=0 -o /tmp/winjit-test-out/id-guest.elf /tmp/winjit-test-out/id-guest.o
          objcopy -O binary /tmp/winjit-test-out/id-guest.elf /tmp/winjit-test-out/id-guest.bin
          cd /tmp/winjit-qemu
          set +e
          timeout --signal=TERM --kill-after=2s 9s \
            ./build/qemu-system-aarch64 -accel tcg \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu cortex-a53 -smp 1 -m 128M \
            -bios /tmp/winjit-test-out/id-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/id-tcg.log 2>&1
          TCG_EXIT=$?
          LD_LIBRARY_PATH=/tmp/winjit-lib \
          timeout --signal=TERM --kill-after=2s 11s \
            gdb --quiet --batch -ex run -ex 'thread apply all bt 12' --args \
            ./build/qemu-system-aarch64 -accel winjit \
            -machine virt,gic-version=2,secure=off,virtualization=off \
            -cpu cortex-a53 -smp 1 -m 128M \
            -bios /tmp/winjit-test-out/id-guest.bin \
            -nographic -monitor none -serial stdio \
            > /tmp/winjit-test-out/id-winjit.log 2>&1
          WINJIT_EXIT=$?
          set -e
          python3 - "$TCG_EXIT" "$WINJIT_EXIT" <<'PY'
          from pathlib import Path
          import re,sys
          work=Path('/tmp/winjit-test-out')
          def vals(name):
              return [line for line in (work/name).read_text().splitlines()
                      if re.fullmatch(r'[0-9A-F]{16}',line)]
          tcg=vals('id-tcg.log')
          winjit=vals('id-winjit.log')
          t, w=map(int,sys.argv[1:])
          report='CPU register values TCG='+repr(tcg)+' WinJIT='+repr(winjit)+'\n'
          (work/'id-comparison.txt').write_text(report)
          print(report)
          with (work/'STATUS.txt').open('a') as f:
              if t!=124 or w!=124 or len(tcg)!=3 or len(winjit)!=3:
                  f.write('FAIL: CPU register-probe did not run correctly\n')
                  raise SystemExit(1)
              if tcg!=winjit:
                  f.write('FAIL: QEMU and WinJIT return different CPU identity/feature/timer values\n')
                  raise SystemExit(1)
              f.write('PASS: guest CPU identification and timer values agree with TCG\n')
          PY

