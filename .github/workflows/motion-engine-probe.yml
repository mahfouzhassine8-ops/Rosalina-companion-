name: Rosalina real image-to-video engine probe
on:
  push:
    branches: [motion-engine-validation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-engine-probe
  cancel-in-progress: true
jobs:
  native-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
          path: third_party/stable-diffusion.cpp
          submodules: recursive
      - name: Build isolated video worker
        run: |
          cmake -S motion-engine -B build-motion -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_SOURCE="$PWD/third_party/stable-diffusion.cpp"
          cmake --build build-motion --target rosalina-motion --parallel 2
          build-motion/rosalina-motion --self-test
      - name: Real photo plus prompt diffusion probe
        run: python3 motion-tests/probe.py build-motion/rosalina-motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rosalina-Motion-real-engine-probe
          path: |
            motion-probe/*.png
            motion-probe/*.json
            motion-probe/*.mp4
            motion-probe/*.log
