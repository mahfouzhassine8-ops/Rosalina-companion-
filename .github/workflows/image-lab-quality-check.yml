name: Image Lab default-resolution validation
on:
  push:
    branches: [ image-lab-validation ]
permissions:
  contents: read
jobs:
  render-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
          path: third_party/stable-diffusion.cpp
          submodules: recursive
          persist-credentials: false
      - name: Build the identical image worker
        run: |
          cmake -S image-engine -B native-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_SOURCE="$PWD/third_party/stable-diffusion.cpp"
          cmake --build native-host --target rosalina-image --parallel 2
      - name: Test actual default 512-square 12-step generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality
          curl --fail --location --retry 3 -o quality/sd15.gguf 'https://huggingface.co/second-state/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf'
          echo 'b8944e9fe0b69b36ae1b5bb0185b3a7b8ef14347fe0fa9af6c64c4829022261f  quality/sd15.gguf' | sha256sum --check
          WORKER=$(find native-host -type f -name rosalina-image -perm -111 | head -n 1)
          python3 tests/default_render.py "$WORKER" quality/sd15.gguf quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rosalina-Image-Lab-default-render-test
          path: |
            quality/*.png
            quality/*.json
            quality/*.txt
          if-no-files-found: warn
